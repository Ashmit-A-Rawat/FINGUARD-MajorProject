server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Strict CSP: the UI loads only its own scripts/styles and talks only to this origin.
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 300s; }
  location /health { proxy_pass http://api:8000; }
  location / { try_files $uri /index.html; }
}
