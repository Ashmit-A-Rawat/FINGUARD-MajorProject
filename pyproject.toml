[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-guard"
version = "0.1.0"
description = "On-premise multi-agent AI system for KYC verification and transaction anomaly detection (research prototype; synthetic data only)."
requires-python = ">=3.11"
license = { text = "MIT" }
# Phase 1 core dependencies only. Heavy ML/LLM stacks are optional extras,
# installed in the phase that needs them.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7"]
data = ["pandas>=2.2", "numpy>=1.26"]                     # Phase 2-3
db = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1", "alembic>=1.13"]        # Phase 3+
ml = ["scikit-learn>=1.5", "xgboost>=2.0", "torch>=2.3", "matplotlib>=3.8"]  # Phase 4-5
kyc = ["rapidfuzz>=3.9", "scikit-learn>=1.5", "sentence-transformers>=3.0"]   # Phase 4
rag = ["chromadb>=0.5", "sentence-transformers>=3.0"]                    # Phase 7
llm = ["transformers>=4.44", "peft>=0.12", "accelerate>=0.33"]           # Phase 8, 12
agents = ["langgraph>=0.2"]                                              # Phase 9

[tool.setuptools.packages.find]
include = [
  "backend*", "data_pipeline*", "kyc*", "anomaly_detection*", "reconciliation*",
  "knowledge_base*", "llm*", "agents*", "guardrails*", "evaluation*",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "integration: tests that span several components",
  "slow: tests that are slow or need heavy optional dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", ".venv", "backend/tests/knowledge_base/kb_helpers.py", "backend/tests/agents/agent_helpers.py"]

[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"experiments/**" = ["E501"]  # report-rendering strings

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["backend/tests/knowledge_base", "backend/tests/agents"]  # plain (non-package) test helper modules
exclude = [
  "frontend", ".venv",
  "backend/tests/knowledge_base/kb_helpers.py", "backend/tests/agents/agent_helpers.py",
]
